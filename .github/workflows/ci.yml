name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
    env:
      MONGO_URI: mongodb://localhost:27017/dev-not-used
      MONGO_URI_TEST: mongodb://localhost:27017/test
      tokenKey: ci-dummy-token-key
      GOOGLE_CLIENT_ID: ci-dummy-google-client-id
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install -g pnpm@12.16.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Smoke test the compiled server
        run: |
          node dist/server.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            if [ "$(curl -s http://localhost:4000/)" = "Index" ]; then echo "smoke OK"; exit 0; fi
            sleep 1
          done
          cat server.log
          exit 1

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install -g pnpm@12.16.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  e2e:
    # Built client + real API + MongoDB: register, log in, add and delete a film.
    # Google sign-in cannot run here and stays a manual check.
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
    env:
      MONGO_URI: mongodb://localhost:27017/e2e
      tokenKey: ci-dummy-token-key
      GOOGLE_CLIENT_ID: ci-dummy-google-client-id
      VITE_API_URL: http://localhost:4000
      VITE_GOOGLE_CLIENT_ID: ci-dummy-google-client-id
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install -g pnpm@12.16.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: client
      - run: pnpm build
        working-directory: client
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: client
      - run: pnpm e2e
        working-directory: client
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: client/test-results

  network-tests:
    # Non-blocking: depends on live Rotten Tomatoes / TMDb, which may block CI IPs.
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
    env:
      MONGO_URI: mongodb://localhost:27017/dev-not-used
      MONGO_URI_TEST: mongodb://localhost:27017/test
      tokenKey: ci-dummy-token-key
      GOOGLE_CLIENT_ID: ci-dummy-google-client-id
      TMDb_API_KEY: ${{ secrets.TMDB_API_KEY }}
      RUN_NETWORK_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install -g pnpm@12.16.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
